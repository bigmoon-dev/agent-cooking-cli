[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-cooking-cli"
version = "0.1.0"
description = "Evidence-first, artifact-driven bug triage workflow for CLI agents"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "Apache-2.0" }
authors = [{ name = "triageflow" }]
dependencies = [
  "typer>=0.9.0",
  "PyYAML>=6.0.1",
]

[project.urls]
Repository = "https://github.com/bigmoon-dev/agent-cooking-cli"

[project.optional-dependencies]
dev = [
  "pytest>=7.0.0",
  "pytest-cov>=4.0.0",
  "build>=1.0.0",
  "wheel>=0.41.0",
]

[project.scripts]
kitchen = "triageflow.cli:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
