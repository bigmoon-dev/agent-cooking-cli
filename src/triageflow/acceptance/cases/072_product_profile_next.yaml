name: product_profile_next
description: product profile runs rounds and next suggests generic evidence add

steps:
  - type: run
    args: ["init", "--profile", "product_definition_v1"]
    expect_exit: 0

  - type: run
    args: ["next"]
    expect_exit: 0
  - type: assert_last_stdout_contains
    contains: "Next: round run 0"

  - type: run
    args: ["round", "run", "0", "--no-editor"]
    input: |
      Product: low power onboarding
      headset users
      pairing is confusing
      goals
      non-goals
      constraints
      metrics
    expect_exit: 0

  - type: run
    args: ["next"]
    expect_exit: 0
  - type: assert_last_stdout_contains
    contains: "Next: round run 1"

  - type: run
    args: ["round", "run", "1", "--no-editor"]
    input: |
      current
      insights
      options
      decision
      rollout
      risks
      validation
    expect_exit: 0

  - type: run
    args: ["next"]
    expect_exit: 0
  - type: assert_last_stdout_contains
    contains: "Next: evidence add-text"
