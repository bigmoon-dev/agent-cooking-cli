name: design_profile_next
description: design profile runs rounds and next suggests generic evidence add

steps:
  - type: run
    args: ["init", "--profile", "design_system_v1"]
    expect_exit: 0

  - type: run
    args: ["next"]
    expect_exit: 0
  - type: assert_last_stdout_contains
    contains: "Next: round run 0"

  - type: run
    args: ["round", "run", "0", "--no-editor"]
    input: |
      Design: cache layer
      Reduce p95 latency
      goals
      non-goals
      constraints
      stakeholders
      metrics
    expect_exit: 0

  - type: run
    args: ["next"]
    expect_exit: 0
  - type: assert_last_stdout_contains
    contains: "Next: round run 1"

  - type: run
    args: ["round", "run", "1", "--no-editor"]
    input: |
      current
      options
      decision
      rationale
      risks
      plan
    expect_exit: 0

  - type: run
    args: ["next"]
    expect_exit: 0
  - type: assert_last_stdout_contains
    contains: "Next: evidence add-text"
